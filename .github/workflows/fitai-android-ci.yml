name: FitAI Android CI

on:
  push:
    branches:
      - feat/fitai-pro-2.7-opengym-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fitai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-emulator-smoke:
    name: Build, unit, lint and emulator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Recover FitAI Pro 2.7 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf buildsrc
          mkdir -p buildsrc
          mapfile -t PARTS < <(find source/chunks -maxdepth 1 -type f -name 'fitai27.tar.xz.b64.*' | sort)
          test ${#PARTS[@]} -gt 0
          cat "${PARTS[@]}" | base64 --decode > /tmp/fitai27.tar.xz
          xz -t /tmp/fitai27.tar.xz
          tar -xJf /tmp/fitai27.tar.xz -C buildsrc
          SETTINGS="$(find buildsrc -type f -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS"
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Recovered Android project: $PROJECT_DIR"

      - name: Unit tests, lint and debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle --stacktrace testProDebugUnitTest lintProDebug assembleProDebug

      - name: Record APK metadata and hash
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          APK="$(find app/build/outputs/apk/pro/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" | tee FITAI_APK_SHA256.txt
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          PKG="$($AAPT dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n1)"
          test -n "$PKG"
          echo "APP_PACKAGE=$PKG" >> "$GITHUB_ENV"
          echo "Detected package: $PKG"

      - name: Upload APK before emulator gate
        uses: actions/upload-artifact@v4
        with:
          name: FitAI-Pro-2.7-QA-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/pro/debug/*.apk
            ${{ env.PROJECT_DIR }}/FITAI_APK_SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Emulator instrumentation + launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            cd "$PROJECT_DIR"
            gradle --stacktrace connectedProDebugAndroidTest assembleProDebug
            APK="$(find app/build/outputs/apk/pro/debug -type f -name '*.apk' -print -quit)"
            AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
            PKG="$($AAPT dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -n1)"
            adb install -r "$APK"
            adb shell am force-stop "$PKG" || true
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
            sleep 4
            adb shell pidof "$PKG"

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FitAI-Pro-2.7-QA-Reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/
            ${{ env.PROJECT_DIR }}/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
